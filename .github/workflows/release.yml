name: Release

# Builds the Windows, macOS and Linux apps and publishes a GitHub Release
# whenever changes land on `main` — i.e. when a dev → main pull request is
# merged. Can also be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Run the JavaScript actions on Node 24, silencing the Node 20 deprecation
# warnings (actions/checkout, setup-node, upload-artifact, download-artifact).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: win
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.name }} installer
        run: npm run dist:${{ matrix.name }} -- --publish never
        env:
          # the app is intentionally unsigned — don't search for certificates
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Read app version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          shopt -s nullglob
          files=(artifacts/*)
          echo "Publishing $tag with ${#files[@]} file(s):"
          printf '  - %s\n' "${files[@]}"
          # replace an existing release for this version so re-runs are clean
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "${files[@]}" \
            --title "SSH Deployer $tag" \
            --generate-notes \
            --latest
